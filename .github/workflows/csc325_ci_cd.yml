name: CSC 325 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Verify Python version
        run: python -c 'import sys; assert sys.version_info[:2] == (3, 13); print(sys.version)'

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Django checks and complete test suite
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py test --verbosity 2
      - name: Check production settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Deploy tested commit and verify public health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: python scripts/deploy_render.py
